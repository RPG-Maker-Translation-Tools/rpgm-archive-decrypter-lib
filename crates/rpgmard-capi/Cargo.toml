[package]
name = "rpgmard-capi"
version = "0.1.0"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2021"
rust-version = "1.71.0"
description = "C bindings for rpgmad-lib, installable via cargo-c."
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-archive-decrypter-lib"
documentation = "https://github.com/RPG-Maker-Translation-Tools/rpgm-archive-decrypter-lib/tree/master/crates/rpgmard-capi"
license-file = "../../LICENSE.md"
keywords = ["rpgmaker", "rgss", "capi", "decrypt", "encrypt"]
publish = false

[lib]
name = "rpgmard"
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[features]
default = ["std"]
std = ["rpgmad-lib/std"]
capi = []

[dependencies]
rpgmad-lib = { path = "../..", default-features = false }

[package.metadata.capi.header]
name = "rpgmard"
subdirectory = "rpgmard"
# Generation is disabled to not generate a header using cbindgen, we provide a header ourselves
generation = false

[package.metadata.capi.pkg_config]
name = "rpgmard"
filename = "rpgmard"

[package.metadata.capi.library]
name = "rpgmard"
