[package]
name = "rpgmad-lib"
version = "5.0.2"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2021"
rust-version = "1.77.0"
description = "Library for decrypting/encrypting RPG Maker `rgss` archives."
readme = "README.md"
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-archive-decrypter-lib"
homepage = "https://crates.io/crates/rpgmad-lib"
documentation = "https://docs.rs/rpgmad-lib"
license = "WTFPL"
keywords = ["rpgmaker", "rgss", "archive", "decrypt", "encrypt"]
categories = ["encoding", "game-development"]
exclude = ["/.gitignore", "/.gitattributes", "/rustfmt.toml", "/ts", "/tests"]

[workspace]
members = ["crates/rpgmard-capi", "crates/rpgmard-wasm"]

[workspace.package]
version = "5.0.2"
edition = "2021"
rust-version = "1.77.0"
authors = ["savannstm <savannstm@gmail.com>"]
description = "Library for decrypting/encrypting RPG Maker `rgss` archives."
license = "WTFPL"
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-archive-decrypter-lib"
homepage = "https://crates.io/crates/rpgmad-lib"

[features]
default = ["std"]
std = ["thiserror/std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
strum_macros = "0.28.0"
thiserror = { version = "2.0.21", default-features = false, features = [] }

[dev-dependencies]
marshal-rs = "3.3.0"
