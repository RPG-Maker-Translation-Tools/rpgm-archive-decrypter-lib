[package]
name = "rpgmad-lib"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rpgmad-lib"
license.workspace = true
keywords = ["rpgmaker", "rgss", "archive", "decrypt", "encrypt"]
categories = ["encoding", "game-development"]
exclude = ["/.gitignore", "/.gitattributes", "/rustfmt.toml", "/tests"]

[workspace]
members = ["capi", "wasm"]

[workspace.package]
version = "6.0.0"
edition = "2021"
rust-version = "1.77.0"
authors = ["savannstm <savannstm@gmail.com>"]
description = "Library for decrypting/encrypting RPG Maker `rgss` archives."
license = "WTFPL"
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-archive-decrypter-lib"
homepage = "https://crates.io/crates/rpgmad-lib"

[features]
default = ["std"]
std = ["thiserror/std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
strum_macros = "0.28.0"
thiserror = { version = "2.0.21", default-features = false, features = [] }

[dev-dependencies]
marshal-rs = "3.4.0"
